name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  unit_tests:
    runs-on: macos-15

    steps:
      # Checkout the repository
      - uses: actions/checkout@v4

      # Set up Xcode
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4.0'


      # Ensure iOS Simulator runtime exists (install if missing)
      - name: Ensure iOS Simulator runtime
        run: |
          set -euo pipefail
          if ! xcodebuild -showsdks | grep -q "iphonesimulator"; then
            echo "No iOS Simulator SDK found. Downloading iOS platform..."
            xcodebuild -downloadPlatform iOS
          else
            echo "iOS Simulator SDK is available."
          fi

      # Pick an available iOS Simulator destination (fallback to creating one)
      - name: Pick iOS Simulator destination
        run: |
          set -euo pipefail
          echo "Listing available destinations for scheme CyBus..."
          xcodebuild -project CyBus.xcodeproj -scheme CyBus -showdestinations || true

          # Try to extract the first iOS Simulator destination from xcodebuild
          DEST=$(xcodebuild -project CyBus.xcodeproj -scheme CyBus -showdestinations 2>/dev/null \
            | sed -n 's/.*{ \(platform:iOS Simulator[^}]*\) }.*/\1/p' \
            | head -n1 || true)

          if [ -z "$DEST" ]; then
            echo "No destinations returned by xcodebuild. Falling back to simctl..."

            # Get latest iOS runtime identifier (e.g., com.apple.CoreSimulator.SimRuntime.iOS-18-0)
            RUNTIME_ID=$(xcrun simctl list runtimes | awk -F'[()]' '/iOS/ {print $2}' | tail -n1 || true)
            if [ -z "$RUNTIME_ID" ]; then
              echo "No iOS runtime found via simctl. Attempting to download platform..."
              xcodebuild -downloadPlatform iOS
              RUNTIME_ID=$(xcrun simctl list runtimes | awk -F'[()]' '/iOS/ {print $2}' | tail -n1 || true)
            fi

            # Create a device if none exists
            UDID=$(xcrun simctl list devices available | awk -F'[()]' '/iOS/ && /(Booted|Shutdown)/ {print $2; exit}' || true)
            if [ -z "$UDID" ]; then
              echo "No available iOS devices. Creating a new iPhone 15 simulator..."
              UDID=$(xcrun simctl create "CI iPhone 15" "iPhone 15" "$RUNTIME_ID")
            fi

            DEST="id=$UDID"
          fi

          echo "Using destination: $DEST"
          echo "DESTINATION=$DEST" >> $GITHUB_ENV

      # Run tests
      - name: Run tests
        run: xcodebuild test -project CyBus.xcodeproj -scheme CyBus -destination "$DESTINATION" -quiet -skipMacroValidation
  
  notify:
      runs-on: macos-15
      needs: unit_tests
      steps:
        - name: Send notification to Discord
          run: |
            if [ -z "${{ github.event.pull_request.html_url }}" ]; then
              PR_URL="Main branch"
            else
              PR_URL=${{ github.event.pull_request.html_url }}
            fi

            curl -X POST \
              -H "Content-Type: application/json" \
              -d "{\"content\": \"Tests completed! Status: ${{ job.status }}. Branch/PR: $PR_URL\"}" \
              ${{ secrets.DISCORD_WEBHOOK_URL }}
