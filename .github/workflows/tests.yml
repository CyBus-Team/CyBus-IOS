name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  unit_tests:
    runs-on: macos-15

    steps:
      # Checkout the repository
      - uses: actions/checkout@v4

      # Set up Xcode
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4.0'


      # Ensure iOS Simulator runtime exists (install if missing)
      - name: Ensure iOS Simulator runtime
        run: |
          set -euo pipefail
          if ! xcodebuild -showsdks | grep -q "iphonesimulator"; then
            echo "No iOS Simulator SDK found. Downloading iOS platform..."
            xcodebuild -downloadPlatform iOS
          else
            echo "iOS Simulator SDK is available."
          fi

      # Pick an available iOS Simulator destination (fallback to creating one)
      - name: Pick iOS Simulator destination
        run: |
          set -euo pipefail

          echo "Listing available destinations for scheme CyBus (for debugging)..."
          xcodebuild -project CyBus.xcodeproj -scheme CyBus -showdestinations || true

          # Prefer an iPhone simulator with a real UUID
          UDID=$(xcodebuild -project CyBus.xcodeproj -scheme CyBus -showdestinations 2>/dev/null \
            | awk '/platform:iOS Simulator/ && /name:iPhone/ && /id:[0-9A-F-]{36}/ { \
                for (i=1;i<=NF;i++) if ($i ~ /^id:/) { gsub("id:","",$i); gsub(",","",$i); print $i; exit } \
              }' \
            || true)

          # If not found, take any iOS Simulator with a real UUID (may be an iPad)
          if [ -z "${UDID}" ]; then
            UDID=$(xcodebuild -project CyBus.xcodeproj -scheme CyBus -showdestinations 2>/dev/null \
              | awk '/platform:iOS Simulator/ && /id:[0-9A-F-]{36}/ { \
                  for (i=1;i<=NF;i++) if ($i ~ /^id:/) { gsub("id:","",$i); gsub(",","",$i); print $i; exit } \
                }' \
              || true)
          fi

          # If still not found, fall back to creating/booting via simctl
          if [ -z "${UDID}" ]; then
            echo "No real simulator UUID found in -showdestinations. Falling back to simctl..."
            RUNTIME_ID=$(xcrun simctl list runtimes | awk -F'[()]' '/iOS/ && /Available/ {print $2}' | tail -n1 || true)
            if [ -z "$RUNTIME_ID" ]; then
              echo "No iOS runtime found via simctl. Attempting to download platform..."
              xcodebuild -downloadPlatform iOS
              RUNTIME_ID=$(xcrun simctl list runtimes | awk -F'[()]' '/iOS/ && /Available/ {print $2}' | tail -n1 || true)
            fi
            # Create iPhone simulator if none exists
            UDID=$(xcrun simctl list devices available | awk -F'[()]' '/iOS/ {print $2; exit}' || true)
            if [ -z "$UDID" ]; then
              echo "No available iOS devices. Creating a new iPhone 15 simulator..."
              UDID=$(xcrun simctl create "CI iPhone 15" "iPhone 15" "$RUNTIME_ID")
            fi
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b || true
          fi

          if [ -n "${UDID}" ]; then
            DEST="id=${UDID}"
          else
            # Absolute last resort: generic destination lets xcodebuild pick one
            DEST="platform=iOS Simulator,OS=latest"
          fi

          echo "Using destination: $DEST"
          echo "DESTINATION=$DEST" >> $GITHUB_ENV

      # Run tests
      - name: Run tests
        run: xcodebuild test -project CyBus.xcodeproj -scheme CyBus -destination "${DESTINATION:-platform=iOS Simulator,OS=latest}" -destination-timeout 120 -quiet -skipMacroValidation
  
  notify:
      runs-on: macos-15
      needs: unit_tests
      steps:
        - name: Send notification to Discord
          run: |
            if [ -z "${{ github.event.pull_request.html_url }}" ]; then
              PR_URL="Main branch"
            else
              PR_URL=${{ github.event.pull_request.html_url }}
            fi

            curl -X POST \
              -H "Content-Type: application/json" \
              -d "{\"content\": \"Tests completed! Status: ${{ job.status }}. Branch/PR: $PR_URL\"}" \
              ${{ secrets.DISCORD_WEBHOOK_URL }}
