name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  unit_tests:
    runs-on: macos-15

    steps:
      # Checkout the repository
      - uses: actions/checkout@v4

      # Set up Xcode
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0.0'

      # Find available iOS Simulator destination
      - name: Find available iOS Simulator destination
        run: |
          set -euo pipefail
          # Ask xcodebuild for supported destinations for this scheme/project and pick the first iPhone simulator
          DEST=$(xcodebuild -project CyBus.xcodeproj -scheme CyBus -showdestinations \
            | sed -n 's/.*{ \(platform:iOS Simulator[^}]*name:iPhone [^}]*\) }.*/\1/p' \
            | head -n1)
          echo "Using destination: $DEST"
          echo "DESTINATION=$DEST" >> $GITHUB_ENV

      # Run tests
      - name: Run tests
        run: xcodebuild test -project CyBus.xcodeproj -scheme CyBus -destination "$DESTINATION" -quiet -skipMacroValidation
  
  notify:
      runs-on: macos-15
      needs: unit_tests
      steps:
        - name: Send notification to Discord
          run: |
            if [ -z "${{ github.event.pull_request.html_url }}" ]; then
              PR_URL="Main branch"
            else
              PR_URL=${{ github.event.pull_request.html_url }}
            fi

            curl -X POST \
              -H "Content-Type: application/json" \
              -d "{\"content\": \"Tests completed! Status: ${{ job.status }}. Branch/PR: $PR_URL\"}" \
              ${{ secrets.DISCORD_WEBHOOK_URL }}
